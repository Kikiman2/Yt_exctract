{% extends "base.html" %}
{% block content %}
  <section class="panel">
    <h2>Add channel</h2>
    <form method="post" action="/api/channels" class="inline-form">
      <input type="text" name="url" placeholder="https://www.youtube.com/@handle or @handle" required>
      <button type="submit">Subscribe</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Subscribed channels</h2>
      <form method="post" action="/api/check-now">
        <button type="submit">Check now</button>
      </form>
    </div>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Last checked</th>
          <th>Enabled</th>
          <th>Auto-delete</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for channel in channels %}
        <tr>
          <td><a href="{{ channel.url }}" target="_blank" rel="noopener">{{ channel.title }}</a></td>
          <td>{{ channel.last_checked_at or "never" }}</td>
          <td>
            <form method="post" action="/api/channels/{{ channel.channel_id }}/toggle">
              <input type="hidden" name="enabled" value="{{ 'false' if channel.enabled else 'true' }}">
              <button type="submit">{{ "Disable" if channel.enabled else "Enable" }}</button>
            </form>
          </td>
          <td>
            <form method="post" action="/api/channels/{{ channel.channel_id }}/toggle-auto-delete">
              <input type="hidden" name="enabled" value="{{ 'false' if channel.auto_delete_enabled else 'true' }}">
              <button type="submit">{{ "Disable" if channel.auto_delete_enabled else "Enable" }}</button>
            </form>
          </td>
          <td>
            <form method="post" action="/api/channels/{{ channel.channel_id }}/delete"
                  onsubmit="return confirm('Remove this channel? Already-downloaded videos are kept.');">
              <button type="submit">Remove</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
{% endblock %}
