{% extends "base.html" %}
{% block content %}
  <section class="panel">
    <h2>Settings</h2>
    <form method="post" action="/api/settings" class="stacked-form">
      <label>
        Download subfolder (inside the mounted media root)
        <input type="text" name="download_subfolder" value="{{ settings.download_subfolder }}" required>
      </label>
      <label>
        Poll interval (minutes)
        <input type="number" name="poll_interval_minutes" min="1" value="{{ settings.poll_interval_minutes }}" required>
      </label>
      <label>
        Quality
        <select name="quality">
          <option value="best" {{ "selected" if settings.quality == "best" else "" }}>Best available</option>
          <option value="1080p" {{ "selected" if settings.quality == "1080p" else "" }}>Cap at 1080p</option>
        </select>
      </label>
      <label>
        Auto-delete downloaded videos after (days, 0 = never)
        <input type="number" name="auto_delete_days" min="0" value="{{ settings.auto_delete_days }}" required>
      </label>
      <label>
        Max simultaneous downloads
        <input type="number" name="max_concurrent_downloads" min="1" max="5" value="{{ settings.max_concurrent_downloads }}" required>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skip_shorts" value="true" {{ "checked" if settings.skip_shorts == "true" else "" }}>
        Skip YouTube Shorts (auto-discovered uploads only; manual links always download)
      </label>
      <label>
        Fallback Shorts length threshold (seconds) - only used if YouTube's own Shorts flag is unavailable
        <input type="number" name="shorts_max_seconds" min="1" value="{{ settings.shorts_max_seconds }}" required>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" name="skip_live" value="true" {{ "checked" if settings.skip_live == "true" else "" }}>
        Skip live streams that are currently live or upcoming
      </label>
      <button type="submit">Save</button>
    </form>
  </section>
{% endblock %}
